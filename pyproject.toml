[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onyx-gate-drata"
version = "0.1.0"
description = "Onyx Gate for Drata — verify a hash-chained Onyx authorization decision trail independently, then file it as Drata Evidence linked to your controls."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "The Onyx Foundry", email = "contact@onyxfoundry.ai" }]
keywords = ["drata", "compliance", "evidence", "audit-trail", "agents", "authorization", "soc2", "ai-governance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
# Standard library only — the verifier and the Drata client add no dependencies.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
onyx-gate-drata = "onyx_gate_drata.cli:main"

[project.urls]
Homepage = "https://onyxfoundry.ai"
Repository = "https://github.com/jstewart-axyom/onyx-gate-drata"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
